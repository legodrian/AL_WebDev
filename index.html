<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Basic Website</title>
        <meta charset= "UTF-8">

    <style>

        #important{text-decoration: underline;color: gray;}

        #attention{font-weight: bold;}

        #italics{font-style: italic;}

    </style>

    </head>

    <body> 
    <h1>Name of the website</h1>
        <p><span id="important">Paragraph tags</span> are used to <span id="attention">display</span> most of the text on the <span id="italics">webpage</span></p>

    <h3>Sub Header</h3>
        <p>We start a new paragraph tag when we want a new paragraph on the page. <br> This way things are easy to read.</p>
        
    </body>
</html>
