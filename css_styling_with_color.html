<DOCTYPE html>
    <html lang="en">
        <head>
            <title>CSS Styling with Colors</title>
            <meta charset="UTF-8">
        </head>
        <style>
            .box{width: 50%; background-color: blue; border: solid 5px orange}

            .boxx{width: 50%; background-color: red; border: solid 5px purple}

            .boxxx{width: 50%; background-color: green; border: solid 5px yellow}

            body{color: white;}

            h1{text-align:center;}

        </style>

        <body>
        
        <div class="box"> 
            <h1>Complementary</h1>
        </div>

        <div class="boxx"> 
            <h1>Analogous</h1>
        </div>

        <div class="boxxx"> 
            <h1>Triadic</h1>
        </div>

        </body>
    </html>
