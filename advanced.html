<DOCTYPE html>

    <head>
        <title>HTML Advanced Notes</title>
        <meta charset="UTF-8">
        <style>
        /*Cascading Style Sheetd
        1 Selector = says what to change
        2 Declaration
            a property = what about the element to change
            b. value = how to change it
             */
            
            body{color:darkgreen;
            background-color:rgb(133, 133, 133);
            border: inset 5px #001aff;}

            h1{text-align: center;}

            #even{color:chocolate; text-decoration:underline;} 
            .lists{width:50%; background-color:aquamarine; border-radius:5px; font-size:2rem;}
        </style>
</head>
